<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Temple — Zuma Style Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="player-card" class="hidden">
        <img id="player-face" alt="">
        <div class="player-info"><b id="player-name">Player</b><span id="player-account"></span></div>
        <button id="player-sign-in" class="hidden">Sign in</button>
    </div>

    <div id="hud">
        <div id="score-panel">
            <div class="hud-item"><span class="hud-label">SCORE</span><span id="score">0</span></div>
            <div class="hud-item"><span class="hud-label">LEVEL</span><span id="level">1</span></div>
            <div class="hud-item"><span class="hud-label">BEST</span><span id="high-score">0</span></div>
        </div>
        <div id="combo-display" class="hidden"></div>
    </div>

    <div id="start-screen" class="overlay">
        <div class="panel">
            <h1>ORB TEMPLE</h1>
            <p class="subtitle">Zuma-Style Puzzle Game</p>
            <div class="controls-info">
                <div class="control"><kbd>Mouse</kbd> Aim</div>
                <div class="control"><kbd>Click</kbd> Shoot</div>
                <div class="control"><kbd>Space</kbd> Swap ball</div>
            </div>
            <p class="hint">Match 3+ orbs of the same color to destroy them!<br>Don't let them reach the end of the path!</p>
            <button id="btn-start" class="btn-primary">START GAME</button>
        </div>
    </div>

    <div id="gameover-screen" class="overlay hidden">
        <div class="panel">
            <h1>GAME OVER</h1>
            <div class="final-stats">
                <div class="stat"><span>Score</span><strong id="final-score">0</strong></div>
                <div class="stat"><span>Level</span><strong id="final-level">1</strong></div>
            </div>
            <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
        </div>
    </div>

    <div id="level-screen" class="overlay hidden">
        <div class="panel">
            <h1>LEVEL COMPLETE!</h1>
            <p class="subtitle">Get ready for the next level...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
    <script src="config.js"></script>
    <script src="audio.js"></script>
    <script src="startng.js"></script>
    <script src="effects.js"></script>
    <script src="game.js"></script>
</body>
</html>
